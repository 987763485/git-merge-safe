[package]
name = "git-merge-safe"
version = "0.1.0"
edition = "2021"
description = "Squash-merge a branch without bringing excluded paths into the current branch"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
